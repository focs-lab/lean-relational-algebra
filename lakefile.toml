name = "relation_algebra"
version = "0.1.0"
description = "Kleene algebra, KAT, relation algebra, and proof-producing tactics in Lean 4"
homepage = "https://github.com/focs-lab/lean-relational-algebra"
license = "LGPL-3.0-or-later"
licenseFiles = ["LICENSE", "COPYING", "COPYING.LESSER", "NOTICE.md"]
keywords = ["math", "kleene algebra", "KAT", "relations"]
defaultTargets = ["RelationAlgebra"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "RelationAlgebra"
